name: Cập nhật tin
on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 */2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tin-tuc-sang/scripts/fetch-news.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: tin-tuc-sang/public }
      - uses: actions/deploy-pages@v4
