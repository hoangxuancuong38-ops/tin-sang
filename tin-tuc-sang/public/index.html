<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tin Sáng">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Tin Sáng</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--text:#111;--sub:#666;--acc:#d81e2c}
  @media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#162033;--text:#eef;--sub:#9aa5b8;--acc:#ff5a64}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:var(--bg);color:var(--text)}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px}
  h1{margin:0;font-size:28px}
  #upd{color:var(--sub);font-size:13px}
  nav{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
  nav button{flex:none;border:0;border-radius:18px;padding:8px 14px;font-size:15px;background:var(--card);color:var(--text)}
  nav button.on{background:var(--acc);color:#fff}
  #q{width:100%;margin-top:6px;padding:9px 12px;border-radius:10px;border:0;background:var(--card);color:var(--text);font-size:16px}
  main{padding:4px 16px calc(env(safe-area-inset-bottom) + 20px)}
  a.card{display:block;background:var(--card);border-radius:14px;padding:14px;margin:10px 0;color:inherit;text-decoration:none}
  .meta{font-size:12.5px;color:var(--sub);display:flex;justify-content:space-between;gap:8px}
  .src{color:var(--acc);font-weight:600}
  h3{margin:6px 0;font-size:17px}
  p{margin:0;color:var(--sub);font-size:14px}
  .empty{text-align:center;color:var(--sub);padding:40px}
</style>
</head>
<body>
<header>
  <h1>☀️ Tin Sáng</h1>
  <div id="upd">Đang tải…</div>
  <nav id="tabs">
    <button data-c="vietnam" class="on">🇻🇳 Việt Nam</button>
    <button data-c="world">🌍 Thế giới</button>
    <button data-c="ai">🤖 AI & Công nghệ</button>
    <button data-c="security">🛡️ Bảo mật</button>
  </nav>
  <input id="q" type="search" placeholder="Tìm trong tin…">
</header>
<main id="list"></main>
<script>
const fmt = d => d ? new Date(d).toLocaleString('vi-VN',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Ho_Chi_Minh'}) : 'Không rõ thời gian';
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data = null, cat = 'vietnam';

function render(){
  if(!data) return;
  const q = document.getElementById('q').value.toLowerCase();
  const items = (data.categories[cat]||[]).filter(i=>!q || (i.title+i.summary).toLowerCase().includes(q));
  document.getElementById('list').innerHTML = items.length ? items.map(i=>`
    <a class="card" href="${esc(i.link)}" target="_blank" rel="noopener noreferrer">
      <div class="meta"><span class="src">${esc(i.source)}</span><span>🕒 ${fmt(i.date)}</span></div>
      <h3>${esc(i.title)}</h3>${i.summary?`<p>${esc(i.summary)}</p>`:''}
    </a>`).join('') : '<div class="empty">Không có tin.</div>';
}
async function load(){
  try{
    const r = await fetch('news.json?t='+Date.now(),{cache:'no-store'});
    data = await r.json();
    localStorage.setItem('news', JSON.stringify(data));
  }catch{ data = JSON.parse(localStorage.getItem('news')||'null'); }
  document.getElementById('upd').textContent = data ? 'Cập nhật lúc: '+fmt(data.updated) : 'Chưa có dữ liệu (ngoại tuyến)';
  render();
}
document.getElementById('tabs').onclick = e=>{
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  cat = b.dataset.c; render(); scrollTo(0,0);
};
document.getElementById('q').oninput = render;
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
setInterval(load, 15*60*1000);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
load();
</script>
</body>
</html>
